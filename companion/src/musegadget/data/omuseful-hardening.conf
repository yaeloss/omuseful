# Omuseful: sandboxing for the chat-only companion service.
[Service]
RuntimeDirectory=musegadget omuseful
StateDirectory=musegadget
NoNewPrivileges=yes
ProtectHome=true
ProtectSystem=strict
PrivateTmp=yes
ProtectProc=invisible
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
RestrictSUIDSGID=yes
LockPersonality=yes
# Only what a chat relay needs: chown its status/socket to the omuseful group.
CapabilityBoundingSet=CAP_CHOWN CAP_FOWNER
AmbientCapabilities=
SystemCallFilter=@system-service
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
PrivateDevices=yes
ProtectKernelLogs=yes
ProtectClock=yes
ProtectHostname=yes
RestrictRealtime=yes
UMask=0077
ReadWritePaths=/var/lib/musegadget /run/musegadget /run/omuseful
KillMode=control-group
